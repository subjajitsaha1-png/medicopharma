<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="capsule">
      <rect x="11" y="22" width="42" height="20" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <g transform="rotate(-45 32 32)">
    <g clip-path="url(#capsule)">
      <rect x="11" y="22" width="21" height="20" fill="#FDBA74"/>
      <rect x="32" y="22" width="21" height="20" fill="#FFFFFF"/>
    </g>
    <rect x="11" y="22" width="42" height="20" rx="10" ry="10" fill="none" stroke="#0B4A44" stroke-opacity="0.35" stroke-width="1.4"/>
    <line x1="32" y1="22" x2="32" y2="42" stroke="#0B4A44" stroke-opacity="0.35" stroke-width="1.4"/>
  </g>
</svg>
